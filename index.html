<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>IdeaHub</title>
    <meta name="theme-color" content="#3b82f6" />
    <meta
      name="description"
      content="Save and organize your ideas and links."
    />
    <!-- PWA Manifest placeholder -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="antialiased overflow-hidden">
    <div
      id="app"
      class="h-screen flex flex-col relative max-w-md mx-auto w-full bg-white/10 shadow-2xl overflow-hidden glass-panel rounded-none sm:rounded-3xl sm:my-4 sm:h-[95vh]"
    >
      <!-- Header -->
      <header
        class="flex-none p-5 flex justify-between items-center z-10 glass-panel m-2 mb-0 !rounded-xl !bg-white/40"
      >
        <h1
          class="text-2xl font-bold text-primary drop-shadow-sm"
        >
          IdeaHub
        </h1>
        <button
          id="settings-btn"
          class="p-2 rounded-full hover:bg-white/20 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-slate-700"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 5 9.4a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            ></path>
          </svg>
        </button>
      </header>

      <!-- Category Tabs -->
      <div
        id="category-scroller"
        class="flex-none px-4 py-3 overflow-x-auto no-scrollbar space-x-2 flex items-center"
      >
        <!-- Categories injected by JS -->
      </div>

      <!-- Main Content (Post List) -->
      <main
        id="post-list"
        class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar pb-24"
      >
        <!-- Posts injected by JS -->
        <div class="text-center mt-10 text-slate-600/70">
          <p>No ideas yet? Tap + to add one!</p>
        </div>
      </main>

      <!-- FAB (Floating Action Button) -->
      <button
        id="add-btn"
        class="glass-button-accent absolute bottom-6 right-6 w-14 h-14 rounded-full shadow-lg text-white flex items-center justify-center transition-transform z-20"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <!-- Add Link Modal -->
      <div id="add-modal" class="fixed inset-0 z-50 hidden">
        <div
          class="absolute inset-0 bg-black/20 backdrop-blur-sm"
          id="add-modal-backdrop"
        ></div>
        <div
          class="absolute bottom-0 inset-x-0 glass-panel m-0 rounded-t-3xl rounded-b-none p-6 transform transition-transform duration-300 translate-y-full"
          id="add-modal-content"
        >
          <div class="w-12 h-1 bg-slate-400/50 rounded-full mx-auto mb-6"></div>
          <h2 class="text-xl font-bold mb-4 text-primary">New Idea</h2>
          <form id="add-form" class="space-y-4">
            <div>
              <input
                type="url"
                id="link-input"
                placeholder="Paste link here..."
                class="glass-input"
                required
                autofocus
              />
            </div>
            <div>
              <input
                type="text"
                id="title-input"
                placeholder="Title (optional)"
                class="glass-input"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1 ml-1"
                >Folder</label
              >
              <div
                class="flex space-x-2 overflow-x-auto no-scrollbar py-1"
                id="folder-select-container"
              >
                <!-- Folder chips injected by JS -->
              </div>
            </div>
            <div class="pt-2">
              <button
                type="submit"
                class="glass-button w-full shadow-lg"
              >
                Save Idea
              </button>
            </div>
          </form>
        </div>
      </div>

       <!-- New Folder Modal -->
       <div id="new-folder-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/20 backdrop-blur-sm">
        <div class="glass-panel p-6 w-[80%] max-w-sm mx-auto animate-fade-in relative bg-white/90">
            <h3 class="text-lg font-bold text-primary mb-3">Create Folder</h3>
            <input type="text" id="new-folder-input" class="glass-input mb-4 border-slate-300" placeholder="Folder Name" />
            <div class="flex justify-end space-x-2">
                <button type="button" id="cancel-folder-btn" class="px-4 py-2 text-slate-500 hover:text-slate-700 font-medium rounded-lg hover:bg-slate-100 transition-colors">Cancel</button>
                <button type="button" id="confirm-folder-btn" class="glass-button">Create</button>
            </div>
        </div>
      </div>

      <!-- Settings Modal -->
      <div id="settings-modal" class="fixed inset-0 z-50 hidden flex flex-col bg-white/95 backdrop-blur-md">
        <div class="flex-none p-4 flex justify-between items-center border-b border-gray-100">
            <h2 class="text-xl font-bold text-slate-800">Settings</h2>
            <button id="close-settings-btn" class="p-2 hover:bg-gray-100 rounded-full text-slate-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 animate-fade-in">
            <div class="mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-slate-700">Folders</h3>
                    <button id="settings-add-folder-btn" class="text-sm text-primary font-medium hover:underline">+ New Folder</button>
                </div>
                <div id="settings-folder-list" class="space-y-2">
                    <!-- Folder management items injected here -->
                </div>
            </div>
            <!-- More settings can go here -->
        </div>
      </div>

      <!-- Generic Delete Confirmation Modal -->
      <div id="delete-confirm-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center pointer-events-none">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/20 backdrop-blur-sm pointer-events-auto" id="delete-modal-backdrop"></div>
        
        <!-- Modal Content -->
        <div class="glass-panel w-[90%] sm:w-[80%] max-w-sm mx-auto animate-pop-in relative bg-white/95 shadow-2xl border-red-100 rounded-3xl p-6 pointer-events-auto">
            <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4 text-red-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
            </div>
            <h3 id="delete-modal-title" class="text-lg font-bold text-slate-800 text-center mb-2">Delete Item?</h3>
            <p id="delete-modal-desc" class="text-slate-500 text-center text-sm mb-6">This action cannot be undone.</p>
            <div class="flex space-x-3">
                <button type="button" id="cancel-delete-btn" class="flex-1 py-2.5 text-slate-600 font-medium rounded-xl hover:bg-slate-100 transition-colors border border-transparent">Cancel</button>
                <button type="button" id="confirm-delete-btn" class="flex-1 py-2.5 bg-red-500 text-white font-medium rounded-xl shadow-lg shadow-red-500/30 hover:bg-red-600 transition-transform active:scale-95">Delete</button>
            </div>
        </div>
      </div>

      <!-- Post View Modal -->
      <div
        id="view-modal"
        class="fixed inset-0 z-50 hidden flex flex-col bg-white"
      >
        <div
          class="flex-none p-3 flex justify-between items-center border-b border-gray-100 bg-white"
        >
          <button
            id="close-view-btn"
            class="p-2 hover:bg-gray-100 rounded-full"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <h3 id="view-modal-title" class="font-medium truncate max-w-[200px]">
            Link View
          </h3>
          <div class="flex items-center space-x-2">
            <button
              id="edit-post-btn"
              class="p-2 hover:bg-gray-100 rounded-full text-slate-600"
              title="Edit"
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <a
              id="external-link-btn"
              href="#"
              target="_blank"
              class="p-2 hover:bg-gray-100 rounded-full text-blue-600"
            >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
              ></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>
        </div>
        <div class="flex-1 relative bg-gray-50">
          <iframe
            id="view-frame"
            class="absolute inset-0 w-full h-full border-0"
            sandbox="allow-scripts allow-same-origin allow-forms"
          ></iframe>
          <div
            id="iframe-fallback"
            class="hidden absolute inset-0 flex flex-col items-center justify-center p-6 text-center"
          >
            <p class="text-gray-500 mb-4">
              This content cannot be displayed here.
            </p>
            <a
              id="fallback-link"
              href="#"
              target="_blank"
              class="glass-button bg-blue-500 text-white"
              >Open in Browser</a
            >
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/style.css"></script>
  </body>
</html>
